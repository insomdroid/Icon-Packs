name: Audit HoloKat Artwork Mapping

on:
  push:
    branches:
      - main
    paths:
      - 'scripts/import_holokat_icons.py'
      - 'scripts/import_kitkat_aosp_icons.py'
      - 'scripts/import_kitkat_archive_icons.py'
      - 'references/kitkat-archives/**'
      - '.github/workflows/audit-holokat.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: holokat-artwork-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    name: Import artwork and generate mapping report (no APK)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install image processing dependency
        run: python -m pip install --disable-pip-version-check pillow

      - name: Import original Android 4.4.4 AOSP icons
        run: python3 scripts/import_kitkat_aosp_icons.py

      - name: Import archived KitKat application bitmap icons
        run: python3 scripts/import_kitkat_archive_icons.py

      - name: Merge Jelly Bean archive artwork and generate report
        run: python3 scripts/import_holokat_icons.py

      - name: Upload HoloKat mapping report
        uses: actions/upload-artifact@v4
        with:
          name: holokat-archive-mapping-report
          path: build/holokat-import-report/
          if-no-files-found: error
          retention-days: 30
