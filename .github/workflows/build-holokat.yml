name: Build Holokat Release APK

on:
  push:
    branches:
      - main
    paths:
      - 'pack-holokat/**'
      - 'scripts/import_holokat_icons.py'
      - 'references/kitkat-archives/Icons jb 1.zip'
      - 'references/kitkat-archives/icons jb2.zip'
      - 'settings.gradle.kts'
      - '.github/workflows/build-holokat.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: holokat-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Signed Holokat Release APK
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Install Android build tools
        shell: bash
        run: |
          set -euo pipefail
          echo "$ANDROID_HOME/build-tools/35.0.0" >> "$GITHUB_PATH"
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "build-tools;35.0.0"

      - name: Import Jelly Bean archive artwork
        run: python3 scripts/import_holokat_icons.py

      - name: Generate temporary release signing key
        shell: bash
        run: |
          set -euo pipefail
          KEYSTORE_PATH="$RUNNER_TEMP/holokat-release-${GITHUB_RUN_ID}.jks"
          STORE_PASSWORD="$(openssl rand -hex 24)"
          KEY_PASSWORD="$(openssl rand -hex 24)"
          keytool -genkeypair -v \
            -keystore "$KEYSTORE_PATH" \
            -storetype JKS \
            -storepass "$STORE_PASSWORD" \
            -keypass "$KEY_PASSWORD" \
            -alias holokat-release \
            -keyalg RSA \
            -keysize 2048 \
            -validity 2 \
            -dname "CN=Insomdroid Temporary Holokat Signing"
          {
            echo "HOLOKAT_RELEASE_STORE_FILE=$KEYSTORE_PATH"
            echo "HOLOKAT_RELEASE_STORE_PASSWORD=$STORE_PASSWORD"
            echo "HOLOKAT_RELEASE_KEY_ALIAS=holokat-release"
            echo "HOLOKAT_RELEASE_KEY_PASSWORD=$KEY_PASSWORD"
          } >> "$GITHUB_ENV"

      - name: Build signed release APK
        run: gradle --no-daemon :pack-holokat:assembleRelease

      - name: Verify APK exists
        run: test -s pack-holokat/build/outputs/apk/release/pack-holokat-release.apk

      - name: Upload Holokat APK
        uses: actions/upload-artifact@v4
        with:
          name: holokat-release-apk
          path: pack-holokat/build/outputs/apk/release/pack-holokat-release.apk
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
