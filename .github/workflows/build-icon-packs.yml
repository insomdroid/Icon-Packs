name: Build KitKat Icon Pack

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kitkat-icon-pack-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build KitKat APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Build KitKat APK
        run: gradle --no-daemon :pack-kitkat:assembleDebug

      - name: Upload KitKat APK
        uses: actions/upload-artifact@v4
        with:
          name: kitkat-icon-pack
          path: pack-kitkat/build/outputs/apk/debug/pack-kitkat-debug.apk
          if-no-files-found: error
          retention-days: 14
