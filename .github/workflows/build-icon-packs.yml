name: Build KitKat Release APK

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'README.md'
      - '**/*.md'
      - 'docs/**'
      - 'references/**'
      - 'reference/**'
      - 'reference-images/**'
      - 'screenshots/**'
      - 'Screenshot/**'
      - 'assets/references/**'
      - 'docs/references/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kitkat-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Signed KitKat Release APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Import original Android 4.4.4 AOSP launcher icons
        run: python3 scripts/import_aosp_kitkat_icons.py

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Generate temporary release signing key
        shell: bash
        run: |
          set -euo pipefail
          KEYSTORE_PATH="$RUNNER_TEMP/kitkat-release-${GITHUB_RUN_ID}.jks"
          STORE_PASSWORD="$(openssl rand -hex 24)"
          KEY_PASSWORD="$(openssl rand -hex 24)"
          keytool -genkeypair -v \
            -keystore "$KEYSTORE_PATH" \
            -storetype JKS \
            -storepass "$STORE_PASSWORD" \
            -keypass "$KEY_PASSWORD" \
            -alias kitkat-release \
            -keyalg RSA \
            -keysize 2048 \
            -validity 2 \
            -dname "CN=Insomdroid Temporary KitKat Signing"
          {
            echo "KITKAT_RELEASE_STORE_FILE=$KEYSTORE_PATH"
            echo "KITKAT_RELEASE_STORE_PASSWORD=$STORE_PASSWORD"
            echo "KITKAT_RELEASE_KEY_ALIAS=kitkat-release"
            echo "KITKAT_RELEASE_KEY_PASSWORD=$KEY_PASSWORD"
          } >> "$GITHUB_ENV"

      - name: Build signed release variant
        run: gradle --no-daemon :pack-kitkat:assembleRelease

      - name: Upload signed release APK
        uses: actions/upload-artifact@v4
        with:
          name: kitkat-release-apk
          path: pack-kitkat/build/outputs/apk/release/pack-kitkat-release.apk
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
