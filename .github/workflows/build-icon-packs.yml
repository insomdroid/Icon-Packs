name: Build KitKat Release APK

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'README.md'
      - '**/*.md'
      - 'docs/**'
      - 'references/**'
      - 'reference/**'
      - 'reference-images/**'
      - 'screenshots/**'
      - 'Screenshot/**'
      - 'assets/references/**'
      - 'docs/references/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kitkat-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build KitKat Release APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Build release variant
        run: gradle --no-daemon :pack-kitkat:assembleRelease

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: kitkat-release-unsigned-apk
          path: pack-kitkat/build/outputs/apk/release/pack-kitkat-release-unsigned.apk
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
