name: Build Combined Icon Pack Release APK

on:
  push:
    branches:
      - main
    paths:
      - 'app/**'
      - 'core/**'
      - 'pack-kitkat/**'
      - 'scripts/import_kitkat_aosp_icons.py'
      - 'scripts/import_kitkat_archive_icons.py'
      - 'scripts/import_holokat_icons.py'
      - 'scripts/import_nothink_figma.py'
      - 'scripts/export_nothink_figma.mjs'
      - '.github/workflows/build-nothink.yml'
      - 'references/kitkat-archives/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle/**'
      - 'gradle.properties'
      - '.github/workflows/build-icon-packs.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: combined-icon-pack-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build One Combined Release APK
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Install Android build tools
        shell: bash
        run: |
          set -euo pipefail
          echo "$ANDROID_HOME/build-tools/35.0.0" >> "$GITHUB_PATH"
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "build-tools;35.0.0"

      - name: Set up Python for archive and image processing
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Pillow
        run: python -m pip install --disable-pip-version-check pillow

      - name: Import original Android 4.4.4 AOSP icons
        run: python3 scripts/import_kitkat_aosp_icons.py

      - name: Import archived KitKat application bitmap icons
        run: python3 scripts/import_kitkat_archive_icons.py

      - name: Merge Jelly Bean archive artwork
        run: python3 scripts/import_holokat_icons.py

      - name: Set up Node.js for Figma source
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Figma parser and renderer
        run: npm install --no-save --no-package-lock @grida/refig openfig-core

      - name: Render Figma artwork
        run: node scripts/export_nothink_figma.mjs 'references/kitkat-archives/App & Brand Icons Pack (Community).fig' build/kitkat-figma-export

      - name: Download pinned Figma app mapping catalogue
        run: |
          set -euo pipefail
          mkdir -p build/kitkat-mappings
          curl -fsSL https://raw.githubusercontent.com/LawnchairLauncher/lawnicons/cd91ff0bd00ff0a6c9d606d1c326b451b6563506/app/assets/appfilter.xml -o build/kitkat-mappings/appfilter.xml
          test -s build/kitkat-mappings/appfilter.xml

      - name: Merge Figma artwork into Holokat resources
        run: python scripts/import_nothink_figma.py --exports build/kitkat-figma-export --mapping build/kitkat-mappings/appfilter.xml --res pack-kitkat/src/main/res --minimum 1

      - name: Upload Figma mapping report
        uses: actions/upload-artifact@v4
        with:
          name: holokat-figma-mapping-report
          path: build/kitkat-figma-report/report.json
          if-no-files-found: error
          retention-days: 14

      - name: Upload Holokat archive mapping report
        uses: actions/upload-artifact@v4
        with:
          name: holokat-archive-mapping-report
          path: build/holokat-import-report/
          if-no-files-found: error
          retention-days: 14

      - name: Generate temporary release signing key
        shell: bash
        run: |
          set -euo pipefail
          KEYSTORE_PATH="$RUNNER_TEMP/combined-icon-pack-${GITHUB_RUN_ID}.jks"
          STORE_PASSWORD="$(openssl rand -hex 24)"
          KEY_PASSWORD="$(openssl rand -hex 24)"
          keytool -genkeypair -v \
            -keystore "$KEYSTORE_PATH" \
            -storetype JKS \
            -storepass "$STORE_PASSWORD" \
            -keypass "$KEY_PASSWORD" \
            -alias combined-icon-pack \
            -keyalg RSA \
            -keysize 2048 \
            -validity 2 \
            -dname "CN=Insomdroid Combined Icon Pack Temporary Signing"
          {
            echo "KITKAT_RELEASE_STORE_FILE=$KEYSTORE_PATH"
            echo "KITKAT_RELEASE_STORE_PASSWORD=$STORE_PASSWORD"
            echo "KITKAT_RELEASE_KEY_ALIAS=combined-icon-pack"
            echo "KITKAT_RELEASE_KEY_PASSWORD=$KEY_PASSWORD"
          } >> "$GITHUB_ENV"

      - name: Build optimized release APK
        run: gradle --no-daemon :pack-kitkat:assembleRelease

      - name: Verify APK and report size
        shell: bash
        run: |
          set -euo pipefail
          APK="pack-kitkat/build/outputs/apk/release/pack-kitkat-release.apk"
          test -s "$APK"
          ls -lh "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | head -n 1

      - name: Upload the single combined release APK
        uses: actions/upload-artifact@v4
        with:
          name: insomdroid-combined-icon-pack-release
          path: pack-kitkat/build/outputs/apk/release/pack-kitkat-release.apk
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
