name: Build Nothink 50-App JusIcons Trial

on:
  push:
    branches:
      - main
    paths:
      - 'pack-nothing/**'
      - 'scripts/generate_jusicons_batch.py'
      - 'docs/JUSICONS_PIPELINE.md'
      - 'third_party/jusicons/LICENSE'
      - 'settings.gradle.kts'
      - 'build.gradle.kts'
      - 'gradle/**'
      - 'gradle.properties'
      - '.github/workflows/build-nothink.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nothink-50-app-trial-v1-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Extract 50 APK icons, generate monochrome artwork and build pack
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install generator dependencies
        run: python -m pip install --upgrade pip pillow cairosvg requests
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Install Apktool 3.0.3
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p tools
          curl -fsSL "https://github.com/iBotPeaches/Apktool/releases/download/v3.0.3/apktool_3.0.3.jar" -o tools/apktool_3.0.3.jar
          echo "dbf930b076c6b9be08d57c449cacefc3bdd6b71ebd59b3066fc0e1f5b14f9423  tools/apktool_3.0.3.jar" | sha256sum --check
          java -jar tools/apktool_3.0.3.jar --version
      - name: Install Android SDK 36
        run: |
          set -euo pipefail
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-36" "build-tools;36.0.0"
          echo "$ANDROID_HOME/build-tools/36.0.0" >> "$GITHUB_PATH"
      - name: Download 50 application APKs and generate real monochrome icons
        run: python scripts/generate_jusicons_batch.py --minimum 25 --apktool tools/apktool_3.0.3.jar
      - name: Build Nothink release APK
        run: gradle --no-daemon :pack-nothing:assembleRelease
      - name: Verify generated pack and APK
        shell: bash
        run: |
          set -euo pipefail
          APK="pack-nothing/build/outputs/apk/release/pack-nothing-release.apk"
          test -s "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose "$APK"
          python - <<'PY'
          import xml.etree.ElementTree as ET
          from pathlib import Path
          res = Path("pack-nothing/src/main/res")
          appfilter = ET.parse(res / "xml/appfilter.xml").getroot()
          drawables = ET.parse(res / "xml/drawable.xml").getroot()
          items = appfilter.findall("item")
          indexed = drawables.findall("item")
          if len(indexed) < 25:
              raise SystemExit(f"Expected at least 25 generated app icons, got {len(indexed)}")
          for item in indexed:
              name = item.attrib["drawable"]
              if not (res / "drawable" / f"{name}.xml").is_file():
                  raise SystemExit(f"Missing generated vector: {name}")
          mapped = {item.attrib["drawable"] for item in items}
          known = {item.attrib["drawable"] for item in indexed}
          if not mapped or mapped - known:
              raise SystemExit("appfilter contains missing or empty drawable mappings")
          print(f"Verified {len(indexed)} unique app icons and {len(items)} launcher component mappings.")
          PY
          echo "APK size: $(stat -c %s "$APK") bytes"
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$APK" | sed -n '1p'
      - name: Upload Nothink release APK
        uses: actions/upload-artifact@v4
        with:
          name: nothink-jusicons-50-app-trial
          path: pack-nothing/build/outputs/apk/release/pack-nothing-release.apk
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
      - name: Upload APK extraction report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nothink-jusicons-50-app-report
          path: build/jusicons-report/
          if-no-files-found: warn
          retention-days: 7
