name: Integrate Figma artwork into Holokat

on:
  push:
    branches: [main]
    paths:
      - 'references/kitkat-archives/App & Brand Icons Pack (Community).fig'
      - 'scripts/export_nothink_figma.mjs'
      - 'scripts/import_nothink_figma.py'
      - 'scripts/import_holokat_icons.py'
      - 'pack-kitkat/**'
      - '.github/workflows/build-nothink.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: holokat-figma-${{ github.ref }}
  cancel-in-progress: true

jobs:
  integrate:
    name: Render and integrate Figma artwork into Holokat
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install offline Figma parser and renderer
        run: npm install --no-save --no-package-lock @grida/refig openfig-core

      - name: Render artwork from committed Figma file
        run: node scripts/export_nothink_figma.mjs 'references/kitkat-archives/App & Brand Icons Pack (Community).fig' build/kitkat-figma-export

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install image processing dependency
        run: python -m pip install --disable-pip-version-check pillow

      - name: Download pinned component mapping catalogue
        run: |
          set -euo pipefail
          mkdir -p build/kitkat-mappings
          curl -fsSL https://raw.githubusercontent.com/LawnchairLauncher/lawnicons/cd91ff0bd00ff0a6c9d606d1c326b451b6563506/app/assets/appfilter.xml -o build/kitkat-mappings/appfilter.xml
          test -s build/kitkat-mappings/appfilter.xml

      - name: Import Figma artwork into Holokat resources
        run: python scripts/import_nothink_figma.py --exports build/kitkat-figma-export --mapping build/kitkat-mappings/appfilter.xml --res pack-kitkat/src/main/res --minimum 1

      - name: Upload Figma import report
        uses: actions/upload-artifact@v4
        with:
          name: holokat-figma-import-report
          path: build/kitkat-figma-report/report.json
          if-no-files-found: error
          retention-days: 14
