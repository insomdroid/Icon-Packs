name: Build Nothink Icon Pack Release APK

on:
  push:
    branches:
      - main
    paths:
      - 'pack-nothing/**'
      - 'scripts/import_nothink_lawnicons.py'
      - 'docs/NOTHINK_ATTRIBUTION.md'
      - 'docs/NOTHINK_ATTRIBUTION.md'
      - 'settings.gradle.kts'
      - 'build.gradle.kts'
      - 'gradle/**'
      - 'gradle.properties'
      - '.github/workflows/build-nothink.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nothink-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Generate All Nothink Artwork and Build APK
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      LAWNICONS_REF: cd91ff0bd00ff0a6c9d606d1c326b451b6563506
    steps:
      - name: Checkout Nothink project
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install artwork generator Python dependencies
        run: python -m pip install --upgrade pip pillow

      - name: Download Lawnicons app mappings only
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location \\
            "https://raw.githubusercontent.com/LawnchairLauncher/lawnicons/$LAWNICONS_REF/app/assets/appfilter.xml" \\
            --output "$RUNNER_TEMP/lawnicons-appfilter.xml"
          test -s "$RUNNER_TEMP/lawnicons-appfilter.xml"

      - name: Draw original Nothink artwork for all mapped apps
        run: |
          python scripts/import_nothink_lawnicons.py --mapping-xml "$RUNNER_TEMP/lawnicons-appfilter.xml"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Install Android SDK 36
        shell: bash
        run: |
          set -euo pipefail
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-36" "build-tools;36.0.0"
          echo "$ANDROID_HOME/build-tools/36.0.0" >> "$GITHUB_PATH"

      - name: Generate temporary release signing key
        shell: bash
        run: |
          set -euo pipefail
          KEYSTORE_PATH="$RUNNER_TEMP/nothink-release-${GITHUB_RUN_ID}.jks"
          STORE_PASSWORD="$(openssl rand -hex 24)"
          KEY_PASSWORD="$(openssl rand -hex 24)"
          keytool -genkeypair -v \
            -keystore "$KEYSTORE_PATH" \
            -storetype JKS \
            -storepass "$STORE_PASSWORD" \
            -keypass "$KEY_PASSWORD" \
            -alias nothink \
            -keyalg RSA \
            -keysize 2048 \
            -validity 3650 \
            -dname "CN=Insomdroid Nothink Icon Pack"
          {
            echo "NOTHINK_RELEASE_STORE_FILE=$KEYSTORE_PATH"
            echo "NOTHINK_RELEASE_STORE_PASSWORD=$STORE_PASSWORD"
            echo "NOTHINK_RELEASE_KEY_ALIAS=nothink"
            echo "NOTHINK_RELEASE_KEY_PASSWORD=$KEY_PASSWORD"
          } >> "$GITHUB_ENV"

      - name: Build optimized Nothink release APK
        run: gradle --no-daemon :pack-nothing:assembleRelease

      - name: Verify APK and generated artwork
        shell: bash
        run: |
          set -euo pipefail
          APK="pack-nothing/build/outputs/apk/release/pack-nothing-release.apk"
          test -s "$APK"
          test -s "pack-nothing/src/main/res/xml/appfilter.xml"
          test -s "pack-nothing/src/main/res/xml/drawable.xml"
          test -s "pack-nothing/src/main/res/xml/grayscale_icon_map.xml"
          MAPPINGS="$(grep -c '<item component=' pack-nothing/src/main/res/xml/appfilter.xml)"
          ARTWORK="$(find pack-nothing/src/main/res/drawable-nodpi -maxdepth 1 -name '*.png' ! -name 'themed_*' | wc -l)"
          echo "Nothink app mappings: $MAPPINGS"
          echo "Nothink unique artwork: $ARTWORK"
          test "$MAPPINGS" -ge 3000
          test "$ARTWORK" -gt 0
          ls -lh "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$APK" | head -n 1

      - name: Upload Nothink release APK
        uses: actions/upload-artifact@v4
        with:
          name: nothink-icon-pack-release
          path: pack-nothing/build/outputs/apk/release/pack-nothing-release.apk
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
