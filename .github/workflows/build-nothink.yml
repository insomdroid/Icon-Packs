name: Build Nothink from Figma artwork

on:
  push:
    branches: [main]
    paths:
      - 'references/kitkat-archives/App & Brand Icons Pack (Community).fig'
      - 'scripts/export_nothink_figma.mjs'
      - 'scripts/import_nothink_figma.py'
      - 'pack-nothing/**'
      - '.github/workflows/build-nothink.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nothink-figma-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Export Figma artwork and build Nothink APK
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install offline Figma parser and renderer
        run: npm install --no-save --no-package-lock @grida/refig openfig-core
      - name: Render artwork from the committed Figma file
        run: node scripts/export_nothink_figma.mjs
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install image processing dependency
        run: python -m pip install --upgrade pip pillow
      - name: Download pinned Lawnicons component mappings only
        run: |
          set -euo pipefail
          mkdir -p build/nothink-mappings
          curl -fsSL https://raw.githubusercontent.com/LawnchairLauncher/lawnicons/cd91ff0bd00ff0a6c9d606d1c326b451b6563506/app/assets/appfilter.xml -o build/nothink-mappings/appfilter.xml
          test -s build/nothink-mappings/appfilter.xml
      - name: Import exact-name Figma artworks into Nothink resources
        run: python scripts/import_nothink_figma.py --mapping build/nothink-mappings/appfilter.xml --minimum 1
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Install Android SDK 36
        run: |
          set -euo pipefail
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-36" "build-tools;36.0.0"
          echo "$ANDROID_HOME/build-tools/36.0.0" >> "$GITHUB_PATH"
      - name: Build Nothink release APK
        run: gradle --no-daemon :pack-nothing:assembleRelease
      - name: Verify APK and imported artwork
        run: |
          set -euo pipefail
          APK=pack-nothing/build/outputs/apk/release/pack-nothing-release.apk
          test -s "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose "$APK"
          python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path("build/nothink-figma-report/report.json").read_text())
          apk = Path("pack-nothing/build/outputs/apk/release/pack-nothing-release.apk")
          if report["mapped_applications"] < 1 or report["unique_artworks"] < 1:
              raise SystemExit("No Figma artwork was integrated.")
          print(f"Verified {report['mapped_applications']} mapped apps, {report['unique_artworks']} unique Figma artworks, APK {apk.stat().st_size} bytes.")
          PY
      - name: Upload Nothink APK
        uses: actions/upload-artifact@v4
        with:
          name: nothink-figma-release
          path: pack-nothing/build/outputs/apk/release/pack-nothing-release.apk
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
      - name: Upload Figma export and mapping report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nothink-figma-build-report
          path: |
            build/nothink-figma-export/manifest.json
            build/nothink-figma-report/report.json
          if-no-files-found: warn
          retention-days: 14
