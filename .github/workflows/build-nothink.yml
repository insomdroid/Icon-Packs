name: Build Nothink Icon Pack Release APK

on:
  push:
    branches:
      - main
    paths:
      - 'pack-nothing/**'
      - 'scripts/import_nothink_lawnicons.py'
      - 'docs/NOTHINK_ATTRIBUTION.md'
      - 'settings.gradle.kts'
      - 'build.gradle.kts'
      - 'gradle/**'
      - 'gradle.properties'
      - '.github/workflows/build-nothink.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nothink-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Generate All Nothink Artwork and Build APK
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      LAWNICONS_REF: cd91ff0bd00ff0a6c9d606d1c326b451b6563506
    steps:
      - name: Checkout Nothink project
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install artwork generator Python dependencies
        run: python -m pip install --upgrade pip pillow

      - name: Download Lawnicons app mappings only
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location "https://raw.githubusercontent.com/LawnchairLauncher/lawnicons/$LAWNICONS_REF/app/assets/appfilter.xml" --output "$RUNNER_TEMP/lawnicons-appfilter.xml"
          test -s "$RUNNER_TEMP/lawnicons-appfilter.xml"

      - name: Draw original Nothink artwork for all mapped apps
        run: |
          python scripts/import_nothink_lawnicons.py --mapping-xml "$RUNNER_TEMP/lawnicons-appfilter.xml"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Install Android SDK 36
        shell: bash
        run: |
          set -euo pipefail
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-36" "build-tools;36.0.0"
          echo "$ANDROID_HOME/build-tools/36.0.0" >> "$GITHUB_PATH"

      - name: Build optimized and automatically signed Nothink release APK
        run: gradle --no-daemon :pack-nothing:assembleRelease

      - name: Verify APK and generated artwork
        shell: bash
        run: |
          set -euo pipefail
          APK="pack-nothing/build/outputs/apk/release/pack-nothing-release.apk"
          test -s "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose "$APK"
          test -s "pack-nothing/src/main/res/xml/appfilter.xml"
          test -s "pack-nothing/src/main/res/xml/drawable.xml"
          test -s "pack-nothing/src/main/res/xml/grayscale_icon_map.xml"
          test -s "pack-nothing/src/main/res/mipmap-anydpi-v26/ic_pack.xml"
          test -s "pack-nothing/src/main/res/drawable/ic_pack_foreground.xml"
          test -s "pack-nothing/src/main/res/drawable/ic_pack_monochrome.xml"
          MAPPINGS="$(grep -c '<item component=' pack-nothing/src/main/res/xml/appfilter.xml)"
          ARTWORK="$(find pack-nothing/src/main/res/drawable-nodpi -maxdepth 1 -name '*.webp' ! -name 'themed_*' | wc -l)"
          ARTWORK_BYTES="$(find pack-nothing/src/main/res/drawable-nodpi -maxdepth 1 -name '*.webp' ! -name 'themed_*' -printf '%s\n' | awk '{ total += $1 } END { printf "%d", total }')"
          SAMPLE_DRAWABLE="$(python - <<'PY'
          import hashlib
          import xml.etree.ElementTree as ET
          root = ET.parse('pack-nothing/src/main/res/xml/appfilter.xml').getroot()
          print(root.find('item').attrib['drawable'])
          PY
          )"
          echo "Nothink app mappings: $MAPPINGS"
          echo "Nothink unique artwork: $ARTWORK"
          echo "Nothink artwork payload: $ARTWORK_BYTES bytes"
          test "$MAPPINGS" -ge 3000
          test "$ARTWORK" -gt 0
          test "$ARTWORK_BYTES" -lt 40000000
          python - <<'PY'
          import hashlib
          import xml.etree.ElementTree as ET
          from pathlib import Path

          res = Path("pack-nothing/src/main/res")
          appfilter = ET.parse(res / "xml/appfilter.xml").getroot()
          drawable_index = ET.parse(res / "xml/drawable.xml").getroot()
          mapped = {item.attrib["drawable"] for item in appfilter.findall("item")}
          indexed = {item.attrib["drawable"] for item in drawable_index.findall("item")}
          missing = sorted(name for name in mapped if not (res / "drawable-nodpi" / f"{name}.webp").is_file())
          unlisted = sorted(mapped - indexed)
          if missing:
              raise SystemExit(f"Mapped icons missing WebP artwork: {missing[:10]}")
          if unlisted:
              raise SystemExit(f"Mapped icons missing from drawable.xml: {unlisted[:10]}")
          from PIL import Image
          normal = sorted((res / "drawable-nodpi").glob("*.webp"))
          normal = [item for item in normal if not item.name.startswith("themed_")]
          if not normal:
              raise SystemExit("No generated WebP artwork was found.")
          grayscale_map = ET.parse(res / "xml/grayscale_icon_map.xml").getroot()
          grayscale_drawables = {
              item.attrib["drawable"].removeprefix("@drawable/")
              for item in grayscale_map.findall("icon")
          }
          missing_grayscale = sorted(mapped - grayscale_drawables)
          if missing_grayscale:
              raise SystemExit(f"Mapped icons missing from grayscale theme map: {missing_grayscale[:10]}")
          for path in normal:
              image_file = Image.open(path)
              if image_file.format != "WEBP":
                  raise SystemExit(f"Generated icon artwork must be stored as WebP: {path.name}")
              image = image_file.convert("RGBA")
              if image.getpixel((0, 0))[3] != 0:
                  raise SystemExit(f"Artwork must have a transparent background: {path.name}")
              colors = image.getcolors(maxcolors=256)
              if colors is None or any(a > 0 and (r, g, b) != (0, 0, 0) for count, (r, g, b, a) in colors):
                  raise SystemExit(f"Artwork must use neutral alpha-mask pixels for Android theme tinting: {path.name}")
          benchmarks = ["generic_camera", "google_phone", "google_chrome", "google_calendar", "spotify", "generic_settings"]
          missing_benchmarks = [name for name in benchmarks if not (res / "drawable-nodpi" / f"{name}.webp").is_file()]
          if missing_benchmarks:
              raise SystemExit(f"Missing Nothink benchmark artwork: {missing_benchmarks}")
          benchmark_hashes = {
              hashlib.sha256((res / "drawable-nodpi" / f"{name}.webp").read_bytes()).hexdigest()
              for name in benchmarks
          }
          if len(benchmark_hashes) != len(benchmarks):
              raise SystemExit("Benchmark icons must have distinct artwork files.")
          print(f"Verified {len(mapped)} mappings, shared transparent neutral alpha-mask assets for Android theme tinting, and six distinct benchmark assets.")
          PY
          RESOURCE_DUMP="$("$ANDROID_HOME/build-tools/36.0.0/aapt" dump resources "$APK")"
          if ! grep -Fq ":drawable/$SAMPLE_DRAWABLE" <<< "$RESOURCE_DUMP"; then
            echo "Mapped drawable $SAMPLE_DRAWABLE was stripped from the APK."
            exit 1
          fi
          if ! grep -Eq 'resource .*xml/appfilter' <<< "$RESOURCE_DUMP"; then
            echo "Compiled APK resource table is missing the appfilter XML resource."
            exit 1
          fi
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$APK" | sed -n '1p'
          MANIFEST_DUMP="$("$ANDROID_HOME/build-tools/36.0.0/aapt" dump xmltree "$APK" AndroidManifest.xml)"
          if ! grep -Fq 'com.novalauncher.THEME' <<< "$MANIFEST_DUMP"; then
            echo "Compiled APK manifest is missing Nova Launcher icon-pack metadata."
            exit 1
          fi
          if ! grep -Eq "org.adw.ActivityStarter.THEMES|org.adw.launcher.THEMES|com.novalauncher.THEME|app.lawnchair.icons.THEMED_ICON|PackInfoActivity" <<< "$MANIFEST_DUMP"; then
            echo "APK manifest is missing the expected icon-pack launcher integration entries."
            exit 1
          fi

      - name: Upload Nothink release APK
        uses: actions/upload-artifact@v4
        with:
          name: nothink-icon-pack-release
          path: pack-nothing/build/outputs/apk/release/pack-nothing-release.apk
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
