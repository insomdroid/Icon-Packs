name: Cleanup Workflow History

on:
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  cleanup:
    name: Keep Three Newest Completed Runs
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Delete older completed workflow runs
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail

          echo "Fetching all workflow run pages..."
          RUN_PAGES="$(gh api --paginate --slurp "repos/$GH_REPO/actions/runs?per_page=100")"

          mapfile -t RUN_IDS < <(
            jq -r '
              [ .[].workflow_runs[]
                | select(.status == "completed")
              ]
              | sort_by(.created_at)
              | reverse
              | .[3:]
              | .[].id
            ' <<< "$RUN_PAGES"
          )

          echo "Completed runs selected for deletion: ${#RUN_IDS[@]}"

          if [ "${#RUN_IDS[@]}" -eq 0 ]; then
            echo "Nothing to delete. The three newest completed runs are retained."
            exit 0
          fi

          for run_id in "${RUN_IDS[@]}"; do
            echo "Deleting workflow run $run_id..."
            gh api --silent --method DELETE "repos/$GH_REPO/actions/runs/$run_id"
            echo "Deleted $run_id"
          done

          echo "Cleanup finished. Three newest completed workflow runs were retained."
